name: Docker

on:
  push:
    tags:
      - 'v*'
  # Build-only on every change to the image or what goes into it. The image had
  # never been built in CI, because tags were the only trigger and none had been
  # pushed — so a `prepare` script that broke `pnpm install --prod` sat unnoticed
  # (issue #1). Nothing is pushed to the registry here.
  pull_request:
    branches: [master, main]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  # Dedicated tag for registry-based layer cache.
  # Persists beyond the 7-day GHA cache TTL; survives runner rotation.
  BUILDCACHE_REF: ghcr.io/${{ github.repository }}:buildcache

jobs:
  # Proves the image still builds and serves, without publishing anything.
  build-check:
    name: Build image (no push)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Buildx
        uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435 # v3.11.1

      - name: Build
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83 # v6.18.0
        with:
          context: .
          push: false
          load: true
          tags: sepia:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Container serves /health
        run: |
          cid=$(docker run -d -p 18899:3000 -e SEPIA_SERVER_API_KEY=ci-key sepia:ci)
          for _ in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:18899/health; then ok=1; break; fi
            sleep 1
          done
          docker logs "$cid" | tail -20
          docker rm -f "$cid" >/dev/null
          [ -n "${ok:-}" ] || { echo "::error::image built but did not serve /health"; exit 1; }

  build-push:
    name: Build and push OCI image
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 60

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Log in to GHCR
        uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0  # v4.4.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302  # v6.2.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=sha,prefix=sha-

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c  # v4.2.0

      - name: Build and push
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a  # v7.3.0
        with:
          context: .
          # Build for amd64 only; add linux/arm64 here if multi-arch is needed
          # (arm64 emulation via QEMU adds ~3× build time on amd64 runners).
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Two-layer cache strategy:
          #   1. GHA cache (fast, per-branch, 10 GB limit, 7-day TTL)
          #   2. Registry cache (persistent, survives runner rotation and cold starts)
          # cache-from tries both; first hit wins.
          cache-from: |
            type=gha
            type=registry,ref=${{ env.BUILDCACHE_REF }}
          cache-to: |
            type=gha,mode=max
            type=registry,ref=${{ env.BUILDCACHE_REF }},mode=max
          provenance: true
          sbom: true
