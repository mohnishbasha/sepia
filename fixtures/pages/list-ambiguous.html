<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Item list with a bulk action</title>
  </head>
  <body>
    <h1>Items</h1>

    <!--
      The dangerous shape: a bulk "Delete" in a toolbar, then per-row deletes
      that are spelled identically. Nothing but surrounding text separates the
      irreversible one from the rest (AC-S8, issue #3).
    -->
    <nav aria-label="Toolbar">
      <button type="button" onclick="del('ALL')">Delete</button>
    </nav>

    <ul>
      <li>Item 1 <button type="button" onclick="del(1)">Delete</button></li>
      <li>Item 2 <button type="button" onclick="del(2)">Delete</button></li>
      <li>Item 3 <button type="button" onclick="del(3)">Delete</button></li>
      <li>Item 4 <button type="button" onclick="del(4)">Delete</button></li>
    </ul>

    <section aria-label="Result"><h2 id="result"></h2></section>

    <script>
      function del(n) {
        document.getElementById('result').textContent = 'Deleted item ' + n;
      }
    </script>
  </body>
</html>
